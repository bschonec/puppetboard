#- description: The title of the main page.
#  displayName: PAGE_TITLE
#  name: PAGE_TITLE
#  required: false
#  value: "Puppetboard"
#  type: string
- description: The PuppetDB SSL Certificate
  displayName: PUPPETDB_CERT
  name: PUPPETDB_CERT
  type: string
  value: null
- description: The PuppetDB Key
  displayName: PUPPETDB_KEY
  name: PUPPETDB_KEY
  type: string
  value: null
- description: PuppetDB protocol
  displayName: PUPPETDB_PROTO
  name: PUPPETDB_PROTO
  type: string
  #value: "http"
- description: Defaults to 20 seconds, but you might need to increase this value.
  displayName: PUPPETDB_TIMEOUT
  type: integer
  name: PUPPETDB_TIMEOUT
  value: "20"
  type: integer
#- description: The number of seconds to wait until the index page is automatically refreshed.
#  displayName: REFRESH_RATE
#  name: REFRESH_RATE
#  type: integer
#- description: The limit of the number of reports to load on the node or any reports page.
#  displayName: REPORTS_COUNT
#  name: REPORTS_COUNT
#  type: integer
#  value: "100"
#- description: If set to `True` then a scheduler instance is created in order to execute scheduled jobs.
#  displayName: SCHEDULER_ENABLED
#  name: SCHEDULER_ENABLED
#  type: boolean
#- description: List of the scheduled jobs to trigger within a worker.
